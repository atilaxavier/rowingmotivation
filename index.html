<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rowing Motivation Tips</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
            font-weight: 500;
        }

        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .lang-btn.active {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #1e3c72;
            font-weight: 600;
        }

        .header {
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.8;
            margin-bottom: 20px;
        }

        .tip-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tip-text {
            font-size: 1.3em;
            line-height: 1.6;
            font-weight: 300;
            text-align: center;
        }

        .get-tip-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .get-tip-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
            background: linear-gradient(45deg, #ff5252, #e53935);
        }

        .get-tip-btn:active {
            transform: translateY(0);
        }

        .rowing-icon {
            font-size: 3em;
            margin-bottom: 20px;
            opacity: 0.7;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @media (max-width: 768px) {
            .language-selector {
                position: relative;
                top: auto;
                right: auto;
                margin-bottom: 20px;
                justify-content: center;
            }
            
            .lang-btn {
                padding: 6px 10px;
                font-size: 0.8em;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .tip-text {
                font-size: 1.1em;
            }
            
            .get-tip-btn {
                padding: 12px 25px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="language-selector">
        <button class="lang-btn" onclick="changeLanguage('en')" id="btn-en">English</button>

        let currentLang = 'en';

        function detectBrowserLanguage() {
            const browserLang = navigator.language || navigator.languages[0];
            
            if (browserLang.startsWith('pt')) {
                return 'pt';
            } else if (browserLang.startsWith('es')) {
                return 'es';
            } else if (browserLang.startsWith('fr')) {
                return 'fr';
            } else {
                return 'en';
            }
        }

        function changeLanguage(lang) {
            currentLang = lang;
            
            // Update active button
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');
            
            // Update text content
            const translation = translations[lang];
            document.getElementById('mainTitle').textContent = translation.mainTitle;
            document.getElementById('subtitle').textContent = translation.subtitle;
            document.getElementById('getTipBtn').textContent = translation.getTipBtn;
            document.getElementById('tipText').textContent = translation.initialMessage;
            
            // Update HTML lang attribute
            document.documentElement.lang = lang;
        }

        function getRandomTip() {
            const tipElement = document.getElementById('tipText');
            const tips = translations[currentLang].tips;
            const randomIndex = Math.floor(Math.random() * tips.length);
            const newTip = tips[randomIndex];
            
            // Add fade effect
            tipElement.classList.remove('fade-in');
            
            setTimeout(() => {
                tipElement.textContent = newTip;
                tipElement.classList.add('fade-in');
            }, 100);
        }

        // Initialize app
        window.addEventListener('load', () => {
            // Detect browser language
            const initialLang = detectBrowserLanguage();
            
            changeLanguage(initialLang);
            
            // Get initial tip after language is set
            setTimeout(getRandomTip, 500);
        });

</html>
